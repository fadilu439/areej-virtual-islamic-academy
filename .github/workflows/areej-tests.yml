name: Areej application tests

on:
  push:
    branches:
      - main
      - security/privacy-demo-cleanup
      - feature/areej-persistent-storage-secure
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: areej_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d areej_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AREEJ_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/areej_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Compile application
        run: python -m py_compile app.py
      - name: Run security and regression tests
        run: python -m pytest -q
